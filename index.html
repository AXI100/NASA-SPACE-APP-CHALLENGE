<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080A0C"><title>AGRO MESH</title><link rel="stylesheet" href="/styles.css?v=27"><link rel="stylesheet" href="/vendor/leaflet.css"><script defer src="/vendor/leaflet.js"></script><script defer src="/i18n.js?v=27"></script><script defer src="/offline_rag.js"></script><script defer src="/app.js?v=27"></script></head>
<body><header><div class="bar"><button id="workspaceMenu" type="button" aria-label="Workspace">☰</button><a class="brand" href="/">◈ <b>AGRO MESH</b> <small>• Offline Voice Agent</small></a><button id="impactButton" type="button" data-i="nasaImpact"></button><button id="solarTheme" type="button" aria-label="Sunlight contrast" aria-pressed="false">☀️</button><span id="network" class="pill"></span><div class="languages" aria-label="Language"><button data-lang="en">EN</button><button data-lang="es">ES</button><button data-lang="pt">PT</button></div><button id="mode"></button><label class="switch"><input id="offline" type="checkbox"><span data-i="airplane"></span></label><label class="voice-read" title="Auto-Speak"><input id="read" type="checkbox" checked aria-label="Auto-Speak"> 🔊</label></div></header>
<main>
<section id="dialog" class="voice-stage" data-state="idle" aria-labelledby="voiceGreeting">
 <div class="voice-tools"><label><input id="continuous" type="checkbox" checked> <span data-i="continuous"></span></label><button id="closeAgent" type="button" data-i="expand"></button></div>
 <div class="voice-center"><button class="orb-button" id="heroMic" type="button" aria-label="Microphone"><canvas id="voiceOrb" class="orb" width="240" height="240" aria-hidden="true"></canvas></button>
 <meter id="micLevel" min="0" max="100" value="0" aria-label="Microphone level" hidden></meter><canvas id="waveform" aria-hidden="true"></canvas><output id="voiceTimer">00:00</output>
 <div style="display:flex;align-items:center;gap:.6rem"><span id="voiceStatus" role="status"></span><small id="voiceEngine" class="pill" hidden></small></div><h1 id="voiceGreeting" data-i="greeting"></h1></div>
 <div class="chat" id="chat" role="log"></div><div id="voiceResults"></div>
 <p id="voiceNotice" class="muted" role="status"></p><div id="chips" class="chips"></div>
 <div id="photoTray" class="photo-tray" hidden><img id="photoPreview" alt="Attached field photo"><button id="photoRemove" type="button" data-i="removePhoto"></button></div>
 <form id="ask" class="voice-capsule"><button id="quickOpen" type="button" aria-label="Field settings">+</button>
 <input name="text" required maxlength="2400" data-ph="ask"><button id="photoButton" type="button" aria-label="Camera or photo">📷</button><input id="photoFile" type="file" accept="image/*" capture="environment" hidden><button data-i="send"></button>
 <button id="quickMap" type="button" aria-label="Map and polygon">▱</button><button id="mic" type="button" aria-label="Microphone">🎙️</button></form>
</section>
<dialog id="quickSheet"><form method="dialog"><button aria-label="Close">×</button></form><h2 data-i="farmResources"></h2><div id="quickResources"></div><section class="fieldbar"><strong id="place"></strong><form id="fieldForm"><label><span data-i="crop"></span><select name="crop"></select></label><label><span data-i="operationType"></span><select name="operation_type"></select></label><label><span data-i="livestockHeads"></span><input name="livestock_heads" type="number" min="0" max="100000" step="1" required></label><label><span>ha</span><input name="hectares" type="number" step=".01" min=".01" required></label><button data-i="save"></button></form><button id="sync" data-i="sync"></button></section>
<form id="search"><input name="q" required data-ph="location" autocomplete="off"><button data-i="search"></button><button type="button" id="gps" data-i="gps"></button></form><div id="places"></div></dialog>
<section class="command-center" id="commandCenter" aria-labelledby="commandTitle"><h2 id="commandTitle" data-i="commandCenter"></h2><div id="ontologyGraph"></div><div id="ontologyDetail" class="ontology-detail" aria-live="polite"></div><button id="executePlaybook" type="button" class="primary" data-i="executePlaybook"></button></section>
<section class="cards" id="cards"></section>
<nav id="tabs" aria-label="Workspace"></nav><section id="panel" class="panel"></section>
<div id="notice" role="status"></div></main>
<dialog id="telemetryDialog"><form method="dialog"><button aria-label="Close">×</button></form><h2 data-i="nasaImpact"></h2><button id="demoAlert" type="button" data-i="demoAlert"></button><div id="telemetryContent"></div></dialog><dialog id="evidence"><form method="dialog"><button aria-label="Close">×</button></form><h2 data-i="evidence"></h2><div id="sources"></div></dialog></body></html>
